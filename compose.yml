# ==============================================================================
# Base Docker Compose for Cobalt Core
# ==============================================================================
# Contiene la definición base y común de los servicios.
# Por defecto utiliza la imagen construida/publicada.
# En desarrollo se extiende con compose.override.yml automáticamente.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cobalt-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cobalt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cobalt}"]
      interval: 5s
      timeout: 5s
      retries: 5

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: cobalt-matter-server
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    network_mode: host
    volumes:
      - matter_data:/data

  cobalt:
    image: ghcr.io/joorgeeml13/cobalt-core:latest
    container_name: cobalt-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: ${PORT:-8080}
      MQTT_PORT: ${MQTT_PORT:-1883}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cobalt}?sslmode=disable
      MATTER_SERVER_URL: ${MATTER_SERVER_URL:-ws://host.docker.internal:5580/ws}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  matter_data: